[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "cavi-premiere-mcp"
dynamic = ["version"]
description = "MCP server for Adobe Premiere Pro: scripts over a Photoshop relay and ProRes cuts from clip lists"
readme = "README.md"
authors = [{ name = "CAVI AI" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.15",
    "Private :: Do Not Upload",
]
requires-python = ">=3.15"
dependencies = [
    "cavi-mcp-core",
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
]

[project.scripts]
cavi-premiere-mcp = "cavi_premiere_mcp.server:main"

[tool.uv.sources]
cavi-mcp-core = { git = "https://github.com/cavi-ai/mcp-core.git", branch = "main" }

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/cavi_premiere_mcp"]

[tool.ruff]
line-length = 110
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100", "EXE"]
