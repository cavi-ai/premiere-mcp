name: pin-core

on:
  workflow_dispatch:
    inputs:
      version:
        description: cavi-mcp-core version to lock; the newest when empty
        required: false
  repository_dispatch:
    types: [core-released]

permissions: {}

concurrency:
  group: pin-core
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the pin branch
      pull-requests: write # open the pin pull request
      actions: write # start CI on the pin branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
      - id: sync
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          locked() {
            python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "cavi-mcp-core"))'
          }
          from=$(locked)
          # A named version the index does not serve yet fails the run instead of keeping the old lock.
          uv lock --upgrade-package "cavi-mcp-core${VERSION:+==$VERSION}"
          to=$(locked)
          if [ "$from" != "$to" ]; then
            echo "branch=bot/pin-core-$to" >> "$GITHUB_OUTPUT"
            echo "title=chore: pin cavi-mcp-core $to" >> "$GITHUB_OUTPUT"
            echo "body=- cavi-mcp-core $from -> $to" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sync.outputs.branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          TITLE: ${{ steps.sync.outputs.title }}
          BODY: ${{ steps.sync.outputs.body }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "$BRANCH already proposed"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add uv.lock
          git commit -q -m "$TITLE"
          git push -q origin "$BRANCH"
          for old in $(gh pr list --state open --json number,headRefName -q '.[] | select(.headRefName | startswith("bot/pin-core-")) | .number'); do
            gh pr close "$old" --delete-branch --comment "Superseded by a newer cavi-mcp-core pin."
          done
          gh pr create --head "$BRANCH" --title "$TITLE" --body "$BODY"
          # A pull request opened with the workflow token starts no workflow, so CI is started on its branch.
          gh workflow run ci.yml --ref "$BRANCH"
