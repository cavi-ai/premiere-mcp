name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version is read from the tag
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: false
      # A release is a vX.Y.Z tag on main with a CHANGELOG section for X.Y.Z.
      - name: Check the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $TAG is not on main"; exit 1; }
          grep -q "^## ${TAG#v} - " CHANGELOG.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
      - run: uv sync --locked --dev
      - run: uv run --locked pytest -q
      # A release whose documentation does not build stops before anything is published.
      - name: Build and verify the documentation
        run: |
          uv run --locked python -m scripts.docs.build
          uv run --locked python -m scripts.docs.verify
      - name: Build the wheel and sdist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --out-dir dist
          ls "dist/cavi_premiere_mcp-${TAG#v}-py3-none-any.whl" "dist/cavi_premiere_mcp-${TAG#v}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The PyPI trusted publisher is cavi-ai / premiere-mcp, workflow release.yml, environment pypi.
    environment:
      name: pypi
      url: https://pypi.org/project/cavi-premiere-mcp/
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    name: create the GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and attach the distributions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## "v" - " {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  docs:
    name: publish the release documentation
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the documentation archive to the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the documented version is read from the tag
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Build, verify and package the documentation
        id: artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          commit="$(git rev-parse HEAD)"
          epoch="$(git show -s --format=%ct "$commit")"
          identity=(--version "$version" --tag "$TAG" --commit "$commit" --source-date-epoch "$epoch")
          uv run --locked python -m scripts.docs.build "${identity[@]}"
          uv run --locked python -m scripts.docs.verify "${identity[@]}"
          output="$RUNNER_TEMP/premiere-mcp-docs-release"
          envelope="$RUNNER_TEMP/cavi-oss-release.json"
          uv run --locked python -m scripts.docs.release_artifact \
            --docs-root "docs/premiere-mcp/v${version}" --output "$output" \
            --repository "$GITHUB_REPOSITORY" "${identity[@]}" > "$envelope"
          {
            echo "directory=$output"
            echo "name=premiere-mcp-docs-${TAG}.tar.gz"
            echo "envelope=$envelope"
          } >> "$GITHUB_OUTPUT"
      - name: Attach the documentation to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIRECTORY: ${{ steps.artifact.outputs.directory }}
          ARTIFACT: ${{ steps.artifact.outputs.name }}
        run: gh release upload "$TAG" "$DIRECTORY/$ARTIFACT" "$DIRECTORY/$ARTIFACT.sha256"
      - name: Send the release to cavi-home
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          ENVELOPE: ${{ steps.artifact.outputs.envelope }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::CONSUMER_DISPATCH_TOKEN is required"
            exit 1
          fi
          python3 - "$ENVELOPE" > "$RUNNER_TEMP/payload.json" <<'PY'
          import json
          import sys

          envelope = json.load(open(sys.argv[1]))
          print(json.dumps({"event_type": "cavi-oss-release", "client_payload": envelope}))
          PY
          gh api --method POST /repos/cavi-ai/cavi-home/dispatches --input "$RUNNER_TEMP/payload.json"
