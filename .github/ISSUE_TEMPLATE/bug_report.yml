name: Bug report
description: A defect in the Premiere Pro MCP server, the Bridge relay or the documentation
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach Adobe account details or project files. For a security
        vulnerability, use a private security advisory instead of an issue.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - MCP server (stdio)
        - Bridge relay
        - ExtendScript tool script
        - Documentation
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Tool name and arguments, or the MCP request
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error message and the output of `premiere_status`
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, Premiere Pro and Adobe Bridge versions, Python version, uv version
    validations:
      required: true
